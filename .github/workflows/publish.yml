name: Stage package on npm

on:
  release:
    types: [published]

permissions:
  contents: read
  id-token: write

jobs:
  stage:
    runs-on: ubuntu-latest
    environment: npm
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: '24'
          package-manager-cache: false
          registry-url: 'https://registry.npmjs.org'

      # Staged publishing requires npm >=11.15.0 and Node >=22.14.0.
      - name: Install npm with staged publishing support
        run: |
          npm install --global 'npm@^11.15.0'
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Stage package for approval
        run: npm stage publish --access public --provenance
